name: Build & Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Solver Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          echo "Previous tag: $PREV_TAG"
          echo "## Các thay đổi trong phiên bản ${{ github.ref_name }}:" > release_notes.md
          echo "" >> release_notes.md
          if [ -n "$PREV_TAG" ]; then
            git log "${PREV_TAG}..HEAD" --pretty=format:"* %s (%h)" >> release_notes.md
          else
            git log --pretty=format:"* %s (%h)" >> release_notes.md
          fi
          echo "" >> release_notes.md
          echo "---" >> release_notes.md
          echo "📦 **Tải ứng dụng:** [Solver-${{ github.ref_name }}.apk](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Solver-${{ github.ref_name }}.apk)" >> release_notes.md
          cat release_notes.md

      - name: Accept Android SDK licenses
        run: |
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          echo "Using sdkmanager: $SDKMGR"
          (yes || true) | "$SDKMGR" --licenses > /dev/null

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew :core:model:test :core:solver:test testDebugUnitTest

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease

      - name: Package Solver-${{ github.ref_name }}.apk
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/release/app-release.apk "release-assets/Solver-${{ github.ref_name }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Rubik Solver ${{ github.ref_name }}"
          body_path: release_notes.md
          generate_release_notes: true
          files: "release-assets/Solver-${{ github.ref_name }}.apk"
