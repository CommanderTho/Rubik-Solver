name: Build & Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Solver Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew :core:model:test :core:solver:test testDebugUnitTest

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease

      - name: Package Solver-${{ github.ref_name }}.apk
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/release/app-release.apk "release-assets/Solver-${{ github.ref_name }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Rubik Solver ${{ github.ref_name }}"
          body: "Automated Android Release APK for Rubik Solver 3D (${{ github.ref_name }})."
          files: "release-assets/Solver-${{ github.ref_name }}.apk"
